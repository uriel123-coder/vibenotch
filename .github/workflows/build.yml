name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swiftc --version

      - name: Build universal app
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          REQUIRE_SIGNING: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          if [ -n "$SIGNING_P12_BASE64" ]; then
            export SIGN_P12="$RUNNER_TEMP/signing.p12"
            echo "$SIGNING_P12_BASE64" | base64 --decode > "$SIGN_P12"
          fi
          ./build.sh zip

      - name: Check the bundle
        run: |
          lipo -archs build/VibeNotch.app/Contents/MacOS/VibeNotch
          codesign --verify --verbose build/VibeNotch.app
          codesign -dr - build/VibeNotch.app
          plutil -lint build/VibeNotch.app/Contents/Info.plist

      - uses: actions/upload-artifact@v7
        with:
          name: VibeNotch
          path: build/VibeNotch.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/VibeNotch.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/VibeNotch.zip --title "VibeNotch $GITHUB_REF_NAME" --generate-notes
          fi
